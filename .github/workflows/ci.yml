name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/rfq_mm

      - name: pytest
        run: uv run pytest -q
