name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src/rfq_mm

      - name: pytest
        run: uv run pytest -q

      - name: System deps for weasyprint (PDF) and kaleido (chart PNGs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev
          uv run plotly_get_chrome -y

      - name: Run a 1-day simulation
        run: uv run mm run venues/eix.yaml --date 2026-09-07 --out-dir ci-out

      - name: Generate desk report
        run: uv run mm report venues/eix.yaml --date 2026-09-07 --report-dir ci-report

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-report
          path: ci-report/
