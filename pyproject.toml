[project]
name = "rfq-mm"
version = "0.1.0"
description = "Quote-driven (RFQ) market-making simulator with a venue-rulebook compliance monitor, modelled on the EIX market-maker regime"
authors = [
    { name = "Muhammad Usman Tahir", email = "usmantahir1995@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2",
    "numpy>=1.26",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "pyarrow>=16",
    "plotly>=5",
    "kaleido>=0.2.1",
    "jinja2>=3",
    "weasyprint>=62",
    "structlog>=24",
    "yfinance>=0.2.40",
]

[project.scripts]
mm = "rfq_mm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "types-pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "rfq_mm.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "kaleido.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
